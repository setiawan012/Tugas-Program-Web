<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anugrah Setiawan | Web Developer</title>
<style>
  :root{
    --bg: #0b0d12;
    --bg-glow-1: #1e2a4a;
    --bg-glow-2: #3a1f4d;
    --text: #f5f6fa;
    --text-dim: #9aa0ad;
    --accent: #6ee7b7;
    --card-bg: #12151c;
    --border: #262b36;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(58,31,77,0.55), transparent 40%),
      radial-gradient(circle at 80% 10%, rgba(30,42,74,0.6), transparent 45%);
    overflow-x: hidden;
  }

  nav{
    display:flex;
    justify-content: space-between;
    align-items:center;
    padding: 28px 6%;
  }

  .logo{
    font-weight:700;
    font-size: 1.3rem;
    letter-spacing: 0.5px;
  }

  .nav-links{
    display:flex;
    gap: 32px;
    align-items:center;
    list-style:none;
    font-size: 0.95rem;
    color: var(--text-dim);
  }

  .nav-links a{
    color: inherit;
    text-decoration:none;
  }

  .nav-links .active{
    color: var(--text);
    position:relative;
  }

  .nav-links .active::after{
    content:'';
    position:absolute;
    left:50%;
    bottom:-10px;
    transform: translateX(-50%);
    width:5px;
    height:5px;
    background: var(--accent);
    border-radius:50%;
  }

  .lang{
    display:flex;
    align-items:center;
    gap:6px;
    color: var(--text-dim);
    font-size:0.9rem;
  }

  main{
    display:flex;
    flex-wrap: wrap;
    align-items:center;
    justify-content: space-between;
    gap: 40px;
    padding: 60px 6% 100px;
    max-width: 1300px;
    margin: 0 auto;
  }

  .hero-text{
    max-width: 560px;
  }

  .eyebrow{
    color: var(--text-dim);
    letter-spacing: 2px;
    font-size: 0.8rem;
    margin-bottom: 16px;
  }

  h1{
    font-size: 2.6rem;
    line-height: 1.15;
    font-weight: 800;
    margin-bottom: 18px;
  }

  .role-label{
    color: var(--text-dim);
    font-size: 1rem;
    margin-bottom: 4px;
  }

  .role{
    font-size: 1.4rem;
    font-weight: 700;
    text-decoration: underline;
    text-decoration-color: var(--accent);
    text-underline-offset: 6px;
    margin-bottom: 20px;
  }

  .nim{
    color: var(--text-dim);
    font-size: 0.95rem;
    margin-bottom: 20px;
    letter-spacing: 0.5px;
  }

  .buttons{
    display:flex;
    gap: 16px;
  }

  .btn{
    padding: 14px 26px;
    border-radius: 999px;
    font-weight: 600;
    text-decoration:none;
    font-size: 0.95rem;
    display:inline-flex;
    align-items:center;
    gap: 6px;
  }

  .btn-primary{
    background: var(--accent);
    color: #0b0d12;
  }

  .btn-secondary{
    border: 1px solid var(--border);
    color: var(--text);
  }

  /* ---- Photo card ---- */
  .photo-card{
    position: relative;
    width: 330px;
    max-width: 90vw;
    border-radius: 20px;
    overflow: hidden;
    background: #1a1a1a;
    border: 1px solid var(--border);
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  }

  .photo-frame{
    position: relative;
    width: 100%;
    aspect-ratio: 3/4;
    background: repeating-linear-gradient(
      45deg,
      #23262f,
      #23262f 12px,
      #1a1c22 12px,
      #1a1c22 24px
    );
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
  }

  /* PLACEHOLDER FOTO — ganti background-image di sini dengan foto kamu */
  .photo-frame.has-photo{
    background-image: url('GANTI_DENGAN_LINK_ATAU_PATH_FOTO_KAMU.jpg');
    background-size: cover;
    background-position: center;
  }

  .photo-placeholder-label{
    color: #fff;
    font-size: 0.9rem;
    padding: 20px;
    background: rgba(0,0,0,0.45);
    border: 2px dashed rgba(255,255,255,0.5);
    border-radius: 10px;
    line-height: 1.5;
  }

  .card-name{
    position:absolute;
    top: 22px;
    left: 22px;
    right: 22px;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }

  .card-name .full{
    font-size: 1.5rem;
    font-weight: 800;
  }

  .card-name .role-sub{
    font-size: 0.85rem;
    color: #d7d7d7;
    margin-top: 2px;
  }

  .card-footer{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 14px 18px;
    background: rgba(10,10,12,0.85);
    backdrop-filter: blur(6px);
  }

  .card-footer .user{
    display:flex;
    align-items:center;
    gap: 10px;
  }

  .avatar{
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #444;
    flex-shrink:0;
  }

  .username{
    font-size: 0.85rem;
    font-weight:600;
  }

  .status{
    font-size: 0.75rem;
    color: var(--accent);
  }

  .contact-btn{
    background: #fff;
    color:#111;
    border:none;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight:600;
    cursor:pointer;
  }

  @media (max-width: 900px){
    main{ flex-direction: column; text-align:left; }
    h1{ font-size: 2.1rem; }
  }
</style>
</head>
<body>

<nav>
  <div class="logo">Anugrah.</div>
  <ul class="nav-links">
    <li><a href="#" class="active">Beranda</a></li>
    <li><a href="#">Tentang</a></li>
    <li><a href="#">Proyek</a></li>
    <li><a href="#">Kontak</a></li>
    <li class="lang">🌐 ID</li>
  </ul>
</nav>

<main>
  <div class="hero-text">
    <div class="eyebrow">HALO, SAYA</div>
    <h1>Anugrah Setiawan</h1>
    <div class="role-label">Perkenalkan,</div>
    <div class="role">Mahasiswa Teknik Informatika</div>
    <div class="nim">NIM: 2511102441208</div>

    <div class="buttons">
      <a href="#proyek" class="btn btn-primary">Lihat Proyek ↗</a>
      <a href="#kontak" class="btn btn-secondary">Kontak Saya</a>
    </div>
  </div>

  <div class="photo-card">
    <div class="photo-frame">
      <!-- GANTI FOTO DI SINI: hapus div "photo-placeholder-label" -->
      <!-- lalu ganti dengan: <img src="foto-kamu.jpg" style="width:100%;height:100%;object-fit:cover;"> -->
      <img src="foto ijaza.jpeg" style="width:100%;height:100%;object-fit:cover;">
    
      <div class="card-name">
        <div class="full">Anugrah Setiawan</div>
        <div class="role-sub">Software Engineer</div>
      </div>
    </div>
    <div class="card-footer">
      <div class="user">
        <div class="avatar"></div>
        <div>
          <div class="username">@anugrahsetiawan</div>
          <div class="status">Online</div>
        </div>
      </div>
      <button class="contact-btn">Contact Me</button>
    </div>
  </div>
</main>

</body>
</html>
